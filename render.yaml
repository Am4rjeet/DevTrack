# Render Blueprint — DEVTRACK API
# Docs: https://render.com/docs/blueprint-spec
#
# Set secret env vars in the Render dashboard after linking this repo.
# Required: MONGODB_URI, JWT_ACCESS_SECRET, JWT_REFRESH_SECRET, CSRF_SECRET,
#           CLIENT_URL, ENCRYPTION_KEY

services:
  - type: web
    name: devtrack-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci
    startCommand: npm run start --workspace=server
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: LEADERBOARD_CRON_ENABLED
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CSRF_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_OAUTH_CALLBACK_URL
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
