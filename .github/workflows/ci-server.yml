name: Server CI

on:
  push:
    branches: [main, master]
    paths:
      - 'server/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci-server.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'server/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci-server.yml'

jobs:
  test:
    name: Server tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run server tests
        run: npm test --workspace=server
        env:
          MONGODB_URI: mongodb://localhost:27017/devtrack-test
          LEADERBOARD_CRON_ENABLED: 'false'
