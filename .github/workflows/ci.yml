name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:server
        env:
          MONGODB_URI: mongodb://localhost:27017/devtrack-test
          JWT_ACCESS_SECRET: test-access-secret-32-chars-minimum!!
          JWT_REFRESH_SECRET: test-refresh-secret-32-chars-minimum!
          CSRF_SECRET: test-csrf-secret-32-chars-minimum!!!
          CLIENT_URL: http://localhost:5173
      - run: npm run test:client
